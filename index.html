
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stakka</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: rgb(74, 37, 0);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <img src="1.png" alt="Centered image">
</body>
</html>
